openapi: 3.1.0
info:
  title: Darak Field Operations API
  version: "0.3.0"
  description: |
    The `api/v1` surface used by the Flutter technician app (and, for a few
    back-office routes, by owner/admin tokens). Generated by hand from the code
    on branch `release/0.3.0`: every route in `php artisan route:list --path=api/v1`
    is documented here, and nothing else. When this file and the code disagree,
    the code wins — fix this file.

    Contracts that matter more than the rest:

      * `client_event_id` is generated on the DEVICE and is the idempotency key of
        `POST /sync/events`. Replaying a batch applies each event exactly once.
      * Mutating non-sync routes the app retries accept an `Idempotency-Key`
        header (9 routes, marked below). Same key + same request replays the
        stored 2xx response with `Idempotent-Replayed: true`.
      * Responses for the phone are explicit allowlists (contract C5): bootstrap,
        visit list/detail/transition and `auth/me` never carry contract values,
        client CR/VAT/notes, hourly cost or permissions. Routes documented as
        "Eloquent model serialisation" are NOT allowlisted yet.
      * An issued e-invoice is immutable. Corrections are credit notes.
      * Device clocks are recorded, never trusted alone. Device UTC timestamps are
        stored as Asia/Riyadh wall-clock time on the server.

    Every response carries `X-Request-ID` (a server-generated UUID). Quote it to
    support; the same id is written to the server log with any exception.

    Error bodies use a stable `code` the app switches on, plus a human `message`.
    Framework-level refusals (validation, `abort()`, throttling, missing records)
    use Laravel's default JSON shapes (`ValidationError`, `PlainMessage`).

    On the Vercel demo surface the `/api` prefix is absent (`/v1/...`). The demo
    is never production.
servers:
  - url: https://panel.darak.sa
    description: Production (placeholder domain from the docs — confirm before use)
  - url: http://127.0.0.1:8000
    description: Local development (`php artisan serve`)
  - url: http://10.0.2.2:8000
    description: Local development as seen from the Android emulator
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in, sign-out, current account and device revocation.
  - name: Sync
    description: Offline bootstrap and replay-safe event ingest.
  - name: Visits
    description: Visit list, detail, lifecycle, dispatch and field actions.
  - name: Media
    description: Resumable evidence upload (photos and signatures).
  - name: Inventory
    description: Vehicle stock transfers, stocktakes and back-office stock moves.
  - name: Custody
    description: Items handed to a technician (vehicle, tools, stock).
  - name: Fleet
    description: The technician's assigned vehicle and its safety inspection.
  - name: Reports
    description: Visit PDF and back-office exports.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Sanctum personal access token named `device:<device_uuid>`, issued by
        `POST /api/v1/auth/login`; one active token per device. Absolute lifetime
        `SANCTUM_EXPIRATION` minutes (default 43200 = 30 days). A token unused for
        `DARAK_TOKEN_IDLE_DAYS` (default 14) is rejected with 401. Revoking or
        rejecting the device, disabling the account, an MFA reset or a password
        change ends the token. Every protected route also runs `device.active`
        (see the 403 response).

  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: |
        App version string (e.g. `0.3.0+3`). Stored on the device row (with
        `last_seen_at`, at most every 5 minutes) and shown to the owner.
        Ignored when longer than 32 characters.
      schema:
        type: string
        maxLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional; a UUID v4 per user action is expected. Scoped to the
        authenticated user. The first request with a key is claimed atomically
        and its 2xx response is remembered for `DARAK_IDEMPOTENCY_TTL_HOURS`
        (default 48 h, pruned by `model:prune`). Same key + same method, path and
        body replays the stored response with `Idempotent-Replayed: true` and runs
        nothing. Same key + different request → 422 `IDEMPOTENCY_KEY_REUSED`.
        Same key while the first request is still running → 409
        `IDEMPOTENCY_REQUEST_IN_PROGRESS` (`Retry-After: 2`). Malformed key →
        422 `IDEMPOTENCY_KEY_INVALID`. Non-2xx outcomes are not remembered, so a
        corrected retry may reuse the key. Without the header the request is
        processed normally (older app builds keep working).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,128}$"
    VisitId:
      name: visit
      in: path
      required: true
      description: Visit id. Visits outside the caller's company/branch are 404.
      schema:
        type: integer
    ClientMediaId:
      name: clientMediaId
      in: path
      required: true
      description: Device-generated id registered through a `media.register` sync event.
      schema:
        type: string
        format: uuid
    TransferId:
      name: transfer
      in: path
      required: true
      schema:
        type: integer
    StocktakeSessionId:
      name: session
      in: path
      required: true
      schema:
        type: integer
    CustodyId:
      name: custody
      in: path
      required: true
      schema:
        type: integer
    DeviceId:
      name: device
      in: path
      required: true
      schema:
        type: integer
    LocationId:
      name: location
      in: path
      required: true
      schema:
        type: integer
    From:
      name: from
      in: query
      required: false
      description: Start of the period (date or date-time, Asia/Riyadh).
      schema:
        type: string
    To:
      name: to
      in: query
      required: false
      description: End of the period (date or date-time, Asia/Riyadh). Defaults to now.
      schema:
        type: string

  headers:
    XRequestId:
      description: Server-generated request id; also written to the log.
      schema:
        type: string
        format: uuid
    IdempotentReplayed:
      description: Present (`true`) when the body is a stored replay of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum: ["true"]
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: |
        `UNAUTHENTICATED` — no token, an expired token (30-day absolute or
        14-day idle) or a deleted one. The app signs in again and keeps its
        local queue.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHENTICATED
            message: Authentication required.
    AccessDenied:
      description: |
        Refused before or by the controller:
          * `DEVICE_REVOKED` — the device was revoked or rejected, is unknown, or
            belongs to another user. The app wipes local work data.
          * `USER_INACTIVE` — the account is disabled. The app wipes local work data.
          * `DEVICE_PENDING_APPROVAL` — a second technician device not yet approved
            by the owner (or a user with the `team` permission).
          * `FORBIDDEN` — a policy refused the action (e.g. not your visit).
          * A plain `{message}` body comes from `abort(403)` ownership checks and
            from the panel-permission middleware.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AccessDeniedError"
              - $ref: "#/components/schemas/PlainMessage"
    NotFound:
      description: Record not found, or outside the caller's company/branch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainMessage"
    ValidationFailed:
      description: Request validation failed (Laravel validation error shape).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Throttled:
      description: Rate limit exceeded (`Too Many Attempts.`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainMessage"
    IdempotencyInProgress:
      description: "`IDEMPOTENCY_REQUEST_IN_PROGRESS` — the first request with this Idempotency-Key is still running."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IdempotencyError"
    UnprocessableIdempotent:
      description: |
        Validation failed, an `abort(422)` domain refusal (plain `{message}`), or
        the Idempotency-Key was malformed (`IDEMPOTENCY_KEY_INVALID`) or reused
        for a different request (`IDEMPOTENCY_KEY_REUSED`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/IdempotencyError"
              - $ref: "#/components/schemas/PlainMessage"
    DomainRefusalAsServerError:
      description: |
        Known gap (0.3.0): domain refusals raised as plain `RuntimeException`
        by StocktakeService / ProcurementService (session already closed,
        transfer already processed, insufficient sender stock) are not mapped to
        a 4xx and surface as a generic 500. The app's outbox treats 5xx as
        transient and keeps retrying with backoff.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainMessage"

  schemas:
    PlainMessage:
      type: object
      description: Laravel's default JSON body for abort(), throttling, missing records and server errors.
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Error:
      type: object
      description: Darak error body. Some codes add fields (documented where they occur).
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_VISIT_TRANSITION
        message:
          type: string
      additionalProperties: true
    AccessDeniedError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [DEVICE_REVOKED, USER_INACTIVE, DEVICE_PENDING_APPROVAL, FORBIDDEN]
    IdempotencyError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum: [IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REQUEST_IN_PROGRESS]
    AccountLocked:
      type: object
      description: Per-account lockout after repeated password or second-factor failures (default 5 failures → 15 minutes; the owner inbox is alerted).
      required: [code, message, retry_after]
      properties:
        code:
          type: string
          enum: [ACCOUNT_TEMPORARILY_LOCKED]
        message:
          type: string
        retry_after:
          type: integer
          description: Seconds until the account may try again.
    DevicePendingApproval:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [DEVICE_PENDING_APPROVAL]
        message:
          type: string
        device:
          $ref: "#/components/schemas/DeviceRef"
    DeviceRef:
      type: object
      required: [id, uuid]
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
    InvalidVisitTransition:
      type: object
      required: [code, message, from, to, allowed]
      properties:
        code:
          type: string
          enum: [INVALID_VISIT_TRANSITION]
        message:
          type: string
        from:
          $ref: "#/components/schemas/VisitState"
        to:
          type: string
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/VisitState"
    VisitCloseBlocked:
      type: object
      required: [code, message, blockers]
      properties:
        code:
          type: string
          enum: [VISIT_CLOSE_BLOCKED]
        message:
          type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CloseBlocker"
    MediaRejection:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            code:
              type: string
              enum:
                - EMPTY_CHUNK
                - CHUNK_TOO_LARGE
                - INVALID_MEDIA_SIZE
                - UPLOAD_LIMIT_EXCEEDED
                - OFFSET_MISMATCH
                - UPLOAD_BUSY
                - WRITE_FAILED
                - MEDIA_DISCARDED
                - NO_UPLOAD
                - SIZE_MISMATCH
                - HASH_MISMATCH
                - IMAGE_TOO_LARGE
                - CANNOT_DISCARD_COMPLETE
            expected_offset:
              type: integer
              description: OFFSET_MISMATCH only — resume from this byte.
            total_bytes:
              type: integer
              description: UPLOAD_LIMIT_EXCEEDED and SIZE_MISMATCH.
            uploaded_bytes:
              type: [integer, "null"]
              description: SIZE_MISMATCH only.
            max_pixels:
              type: integer
              description: IMAGE_TOO_LARGE only (DARAK_MAX_IMAGE_PIXELS, default 40000000).
            max_side:
              type: integer
              description: IMAGE_TOO_LARGE only (DARAK_MAX_IMAGE_SIDE, default 12000).

    VisitState:
      type: string
      enum: [scheduled, en_route, started, paused, awaiting_close, completed, reopened]
      description: |
        Allowed moves (Visit::TRANSITIONS):
        scheduled→en_route; en_route→started|scheduled; started→paused|awaiting_close;
        paused→started|awaiting_close; awaiting_close→completed|started;
        completed→reopened; reopened→started.
    CloseBlocker:
      type: object
      required: [code, message_ar, message_en]
      properties:
        code:
          type: string
          enum:
            - ADDITIONAL_WORK_PENDING
            - NO_CHECKLIST
            - ASSET_NOT_INSPECTED
            - ASSET_STATUS_MISSING
            - ASSET_PHOTO_MISSING
            - ASSET_PHOTO_UPLOAD_PENDING
            - ASSET_PHOTO_UPLOAD_FAILED
            - PARTS_NOT_DECLARED
            - SIGNATURE_MISSING
            - SIGNATURE_UPLOAD_PENDING
            - SIGNATURE_UPLOAD_FAILED
            - UPLOADS_PENDING
            - UPLOADS_FAILED
        message_ar:
          type: string
        message_en:
          type: string
        ref:
          description: Optional reference (e.g. the asset or media concerned).

    Me:
      type: object
      description: Allowlisted (C5). Never cost, permissions or MFA state.
      required: [id, name, role, server_time]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [owner_supervisor, admin, technician]
        trade:
          type: [string, "null"]
        specialties:
          type: [array, "null"]
          items:
            type: string
        shift:
          type: object
          properties:
            start:
              type: [string, "null"]
            end:
              type: [string, "null"]
        server_time:
          type: string
          format: date-time

    WorkOrderSummary:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        type:
          type: string
        priority:
          type: string
        title:
          type: [string, "null"]
    SiteSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        client_name:
          type: [string, "null"]
    VisitSummary:
      type: object
      description: Allowlisted visit (C5) for lists and state changes.
      required: [id, state]
      properties:
        id:
          type: integer
        state:
          $ref: "#/components/schemas/VisitState"
        state_changed_at:
          type: [string, "null"]
          format: date-time
        scheduled_start:
          type: [string, "null"]
          format: date-time
        scheduled_end:
          type: [string, "null"]
          format: date-time
        on_site_seconds:
          type: [integer, "null"]
        is_rework:
          type: boolean
        close_blockers:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CloseBlocker"
        work_order:
          oneOf:
            - $ref: "#/components/schemas/WorkOrderSummary"
            - type: "null"
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteSummary"
            - type: "null"
        technician:
          oneOf:
            - type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: "null"
    VisitDetail:
      description: Allowlisted visit detail (C5). No contract/price fields, client CR/VAT/credit/notes, technician cost, part prices or stock unit costs.
      allOf:
        - $ref: "#/components/schemas/VisitSummary"
        - type: object
          properties:
            started_at:
              type: [string, "null"]
              format: date-time
            ended_at:
              type: [string, "null"]
              format: date-time
            closed_at:
              type: [string, "null"]
              format: date-time
            estimated_arrival_at:
              type: [string, "null"]
              format: date-time
            work_order:
              oneOf:
                - type: "null"
                - allOf:
                    - $ref: "#/components/schemas/WorkOrderSummary"
                    - type: object
                      properties:
                        description:
                          type: [string, "null"]
                        status:
                          type: string
                        fault_code:
                          type: [string, "null"]
                        diagnosis_code:
                          type: [string, "null"]
                        resolution_summary:
                          type: [string, "null"]
                        sla_due_at:
                          type: [string, "null"]
                          format: date-time
            site:
              oneOf:
                - type: "null"
                - allOf:
                    - $ref: "#/components/schemas/SiteSummary"
                    - type: object
                      properties:
                        address:
                          type: [string, "null"]
                        lat:
                          type: [number, string, "null"]
                        lng:
                          type: [number, string, "null"]
                        geofence_radius_m:
                          type: [integer, "null"]
                        access_notes:
                          type: [string, "null"]
            assets:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  type:
                    type: string
                  location:
                    type: [string, "null"]
                  qr_code:
                    type: [string, "null"]
                  under_warranty:
                    type: boolean
            checklist_instances:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  asset_id:
                    type: [integer, "null"]
                  status:
                    type: [string, "null"]
                  note:
                    type: [string, "null"]
                  no_parts_used:
                    type: boolean
                  completed_at:
                    type: [string, "null"]
                    format: date-time
            media_files:
              type: array
              items:
                type: object
                properties:
                  client_media_id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                  upload_state:
                    type: string
                    enum: [pending, uploading, complete, failed, discarded]
                  uploaded_bytes:
                    type: integer
                  total_bytes:
                    type: [integer, "null"]
                  captured_at:
                    type: [string, "null"]
                    format: date-time
            stock_moves:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  move_type:
                    $ref: "#/components/schemas/StockMoveType"
                  part_id:
                    type: integer
                  part_name:
                    type: [string, "null"]
                  qty:
                    type: number
            stock_reservations:
              type: array
              items:
                type: object
                properties:
                  part_id:
                    type: integer
                  part_name:
                    type: [string, "null"]
                  qty:
                    type: number
                  stock_location_id:
                    type: integer
                  status:
                    type: string
            additional_work_approvals:
              type: array
              items:
                $ref: "#/components/schemas/AdditionalWorkSummary"
    AdditionalWorkSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        total_amount:
          type: number
        status:
          type: string
    BootstrapVisit:
      type: object
      description: |
        One visit in the offline bootstrap — exactly the keys the phone stores
        (C5). The contract is read only for its service window; its price never
        leaves the server.
      required: [id, state, work_order, site, assets, checklist_instances, stock_reservations, additional_work_approvals]
      properties:
        id:
          type: integer
        state:
          $ref: "#/components/schemas/VisitState"
        scheduled_start:
          type: [string, "null"]
          format: date-time
        scheduled_end:
          type: [string, "null"]
          format: date-time
        on_site_seconds:
          type: [integer, "null"]
        is_rework:
          type: [boolean, "null"]
        work_order:
          type: object
          properties:
            id:
              type: [integer, "null"]
            number:
              type: [string, "null"]
            type:
              type: [string, "null"]
            priority:
              type: [string, "null"]
            title:
              type: [string, "null"]
            description:
              type: [string, "null"]
        sla:
          description: Null when the work order has no SLA due time. The countdown runs only inside the service window.
          oneOf:
            - type: "null"
            - type: object
              properties:
                due_at:
                  type: string
                  format: date-time
                remaining_minutes:
                  type: integer
                status:
                  type: string
                service_window:
                  type: object
                  properties:
                    start:
                      type: string
                      example: "07:00:00"
                    end:
                      type: string
                      example: "23:00:00"
        site:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            client_name:
              type: string
            address:
              type: [string, "null"]
            lat:
              type: [number, string, "null"]
            lng:
              type: [number, string, "null"]
            geofence_radius_m:
              type: [integer, "null"]
            dwell_threshold_s:
              type: [integer, "null"]
            access_notes:
              type: [string, "null"]
        assets:
          type: array
          description: The assets this visit was SCHEDULED to cover (frozen at scheduling), not the site's live list.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              type:
                type: string
              location:
                type: [string, "null"]
              qr_code:
                type: [string, "null"]
              under_warranty:
                type: boolean
              warranty_until:
                type: [string, "null"]
                format: date
        checklist_instances:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              asset_id:
                type: [integer, "null"]
              status:
                type: [string, "null"]
              no_parts_used:
                type: [boolean, "null"]
        stock_reservations:
          type: array
          description: Reservations still in status `reserved`.
          items:
            type: object
            properties:
              part_id:
                type: integer
              part_name:
                type: [string, "null"]
              qty:
                type: number
              stock_location_id:
                type: integer
              location_name:
                type: [string, "null"]
        additional_work_approvals:
          type: array
          items:
            $ref: "#/components/schemas/AdditionalWorkSummary"

    SyncEventType:
      type: string
      enum:
        - visit.transition
        - checklist.upsert
        - parts.declaration
        - part.issue
        - part.return
        - media.register
        - signature.captured
        - site.scanned
        - asset.scanned
        - geofence.ping
        - note.added
    SyncEvent:
      type: object
      required: [client_event_id, visit_id, event_type]
      properties:
        client_event_id:
          type: string
          format: uuid
          description: Device-generated. The server keys idempotency on this (unique index).
        visit_id:
          type: integer
          description: Must be assigned to the device's user, else VISIT_NOT_ASSIGNED / VISIT_REASSIGNED.
        event_type:
          description: |
            One of `SyncEventType`. The request validator accepts any string up to
            48 characters; an unknown type is rejected per event with
            `INVALID_EVENT_PAYLOAD`, never the whole batch.
          anyOf:
            - $ref: "#/components/schemas/SyncEventType"
            - type: string
              maxLength: 48
        payload:
          type: [object, "null"]
          description: |
            At most 32768 bytes as JSON. Shape depends on `event_type` — see the
            `SyncPayload*` schemas. Validated before the event is stored, so a
            rejected payload never appears as a synced business event.
          anyOf:
            - $ref: "#/components/schemas/SyncPayloadVisitTransition"
            - $ref: "#/components/schemas/SyncPayloadChecklistUpsert"
            - $ref: "#/components/schemas/SyncPayloadPartsDeclaration"
            - $ref: "#/components/schemas/SyncPayloadPartIssue"
            - $ref: "#/components/schemas/SyncPayloadPartReturn"
            - $ref: "#/components/schemas/SyncPayloadMediaRegister"
            - $ref: "#/components/schemas/SyncPayloadSignatureCaptured"
            - $ref: "#/components/schemas/SyncPayloadSiteScanned"
            - $ref: "#/components/schemas/SyncPayloadAssetScanned"
            - $ref: "#/components/schemas/SyncPayloadNoteAdded"
            - $ref: "#/components/schemas/SyncPayloadGeofencePing"
        device_timestamp:
          type: [string, "null"]
          format: date-time
          description: Device wall clock (UTC). Stored as Asia/Riyadh wall-clock time; recorded, never trusted alone.
        monotonic_offset_ms:
          type: [integer, "null"]
          description: |
            Milliseconds since the last trusted server time, measured on
            elapsedRealtime within the same boot (BOOT_COUNT) — a source the user
            cannot edit. Null when unknown; never guessed.
        last_trusted_server_time:
          type: [string, "null"]
          format: date-time
          description: Overrides the batch-level value for this event.
        sequence:
          type: [integer, "null"]
          description: Per-device counter. Events are replayed in this order because it survives clock changes.
        lat:
          type: [number, "null"]
        lng:
          type: [number, "null"]
        accuracy_m:
          type: [number, "null"]
          description: |
            Reported GPS accuracy in metres (C3). Negative or non-numeric values are
            ignored; values are capped at 999999. Widens the geofence by at most
            100 m when computing `outside_geofence`.
        is_mocked:
          type: [boolean, "null"]
          description: Android reported a mock location. Recorded and shown on the visit timeline; never a gate.
        actor_user_id:
          type: [integer, "null"]
          description: |
            The account that recorded the event on the phone (C6). When present it
            must equal the device's user, otherwise the event is rejected with
            `ACTOR_MISMATCH` (a queue left by a previous user of a shared handset
            is never booked to the next one).
        source:
          type: [string, "null"]
          maxLength: 24
          description: Defaults to `offline`.
        integrity_hash:
          type: [string, "null"]
          maxLength: 64
    SyncPayloadVisitTransition:
      type: object
      title: visit.transition
      required: [to]
      properties:
        to:
          $ref: "#/components/schemas/VisitState"
        geofence_override_reason:
          type: string
          maxLength: 500
          description: |
            The technician's explanation when starting, requesting close or
            completing away from the site (C3). Kept only for `started`,
            `awaiting_close` and `completed`; trimmed to 500 characters. Never a
            reason to refuse the event. Shown on the visit timeline.
    SyncPayloadChecklistUpsert:
      type: object
      title: checklist.upsert
      required: [asset_id, status]
      properties:
        asset_id:
          type: integer
          minimum: 1
          description: Must belong to the visit's site.
        status:
          type: string
          enum: [ok, needs_followup, fault]
        items:
          type: [array, "null"]
          maxItems: 100
        note:
          type: [string, "null"]
          maxLength: 2000
        client_generated_uuid:
          type: [string, "null"]
          format: uuid
        no_parts_used:
          type: boolean
    SyncPayloadPartsDeclaration:
      type: object
      title: parts.declaration
      required: [no_parts_used]
      properties:
        no_parts_used:
          type: boolean
    SyncPayloadPartIssue:
      type: object
      title: part.issue
      required: [part_id, qty, from_location_id, idempotency_key]
      properties:
        part_id:
          type: integer
          minimum: 1
        qty:
          type: number
          minimum: 0.001
          maximum: 10000
        from_location_id:
          type: integer
          minimum: 1
          description: Must be the stock location of the vehicle assigned to the device's user (else STOCK_LOCATION_FORBIDDEN).
        idempotency_key:
          type: string
          format: uuid
    SyncPayloadPartReturn:
      type: object
      title: part.return
      required: [original_move_id, qty, to_location_id, idempotency_key]
      properties:
        original_move_id:
          type: integer
          minimum: 1
          description: Must be a movement issued on this visit (else PART_NOT_ON_VISIT).
        qty:
          type: number
          minimum: 0.001
          maximum: 10000
        to_location_id:
          type: integer
          minimum: 1
          description: Must be the technician's own vehicle stock.
        idempotency_key:
          type: string
          format: uuid
    SyncPayloadMediaRegister:
      type: object
      title: media.register
      required: [client_media_id, kind, mime, total_bytes]
      properties:
        client_media_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [photo_before, photo_after, signature]
        mime:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: A signature must be image/png.
        total_bytes:
          type: integer
          minimum: 1
          description: At most DARAK_MAX_MEDIA_BYTES (default 26214400).
        captured_at:
          type: [string, "null"]
          format: date-time
        lat:
          type: [number, "null"]
          minimum: -90
          maximum: 90
        lng:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        declared_source:
          type: string
          enum: [camera, on_screen]
          default: camera
        asset_id:
          type: [integer, "null"]
          description: Must belong to the visit's site. A checklist instance is created for it when missing.
        checklist_instance_id:
          type: [integer, "null"]
          description: Must belong to this visit.
    SyncPayloadSignatureCaptured:
      type: object
      title: signature.captured
      required: [client_media_id, signer_name, signer_role]
      properties:
        client_media_id:
          type: string
          format: uuid
          description: A registered `signature` media of this visit.
        signer_name:
          type: string
          maxLength: 190
        signer_role:
          type: string
          maxLength: 120
    SyncPayloadSiteScanned:
      type: object
      title: site.scanned
      required: [qr_code]
      properties:
        qr_code:
          type: string
          maxLength: 190
          pattern: "^SITE-"
    SyncPayloadAssetScanned:
      type: object
      title: asset.scanned
      required: [asset_id, qr_code]
      properties:
        asset_id:
          type: integer
          minimum: 1
        qr_code:
          type: string
          maxLength: 190
          description: Must match the asset, and the asset must belong to the visit's site.
    SyncPayloadNoteAdded:
      type: object
      title: note.added
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4000
    SyncPayloadGeofencePing:
      type: object
      title: geofence.ping
      properties:
        index:
          type: integer
          minimum: 0
    SyncResult:
      type: object
      required: [client_event_id, status]
      properties:
        client_event_id:
          type: [string, "null"]
        status:
          type: string
          enum: [accepted, duplicate, rejected]
        code:
          type: string
          description: Present when `status` is `rejected`.
          enum:
            - MISSING_CLIENT_EVENT_ID
            - ACTOR_MISMATCH
            - VISIT_NOT_ASSIGNED
            - VISIT_REASSIGNED
            - INVALID_EVENT_PAYLOAD
            - INVALID_VISIT_TRANSITION
            - VISIT_CLOSE_BLOCKED
            - NOT_FOUND
            - PART_NOT_ON_VISIT
            - STOCK_LOCATION_FORBIDDEN
            - STOCK_MOVE_REFUSED
            - DB_ERROR
            - EVENT_FAILED
        message:
          type: string
          description: Human-readable; never SQL, paths or exception text.
        request_id:
          type: [string, "null"]
          description: DB_ERROR and EVENT_FAILED — the request id to quote to support.
        from:
          type: string
          description: INVALID_VISIT_TRANSITION only.
        to:
          type: string
          description: INVALID_VISIT_TRANSITION only.
        allowed:
          type: array
          description: INVALID_VISIT_TRANSITION only.
          items:
            type: string
        blockers:
          type: array
          description: VISIT_CLOSE_BLOCKED only — the full list of what is missing.
          items:
            $ref: "#/components/schemas/CloseBlocker"
        retryable:
          type: boolean
          description: |
            VISIT_CLOSE_BLOCKED only. True only when every blocker clears by itself
            (an upload still in flight: UPLOADS_PENDING, ASSET_PHOTO_UPLOAD_PENDING,
            SIGNATURE_UPLOAD_PENDING). Anything else needs the technician.
        state:
          $ref: "#/components/schemas/VisitState"
        checklist_instance_id:
          type: integer
          description: Accepted checklist.upsert.
        no_parts_used:
          type: boolean
          description: Accepted parts.declaration.
        stock_move_id:
          type: integer
          description: Accepted part.issue / part.return.
        media_file_id:
          type: integer
          description: Accepted media.register.
        upload_state:
          type: string
          description: Accepted media.register — where the upload stands.
        uploaded_bytes:
          type: integer
          description: Accepted media.register — resume offset.
    CanonicalVisit:
      type: object
      description: Server state of each visit an accepted event touched in this batch.
      properties:
        id:
          type: integer
        state:
          $ref: "#/components/schemas/VisitState"
        on_site_seconds:
          type: [integer, "null"]
        is_rework:
          type: [boolean, "null"]
        close_blockers:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CloseBlocker"
        checklist_count:
          type: integer
        media_count:
          type: integer
        parts_count:
          type: integer
        server_updated_at:
          type: [string, "null"]
          format: date-time

    StockMoveType:
      type: string
      enum: [RECEIPT, VEHICLE_LOAD, VISIT_ISSUE, VISIT_RETURN, ADJUSTMENT, VEHICLE_TRANSFER]
    StockMove:
      type: object
      description: Eloquent model serialisation of a stock movement.
      additionalProperties: true
      properties:
        id:
          type: integer
        move_type:
          $ref: "#/components/schemas/StockMoveType"
        part_id:
          type: integer
        qty:
          type: string
          description: Decimal with 3 places, serialised as a string.
        from_location_id:
          type: [integer, "null"]
        to_location_id:
          type: [integer, "null"]
        visit_id:
          type: [integer, "null"]
        user_id:
          type: [integer, "null"]
        device_id:
          type: [integer, "null"]
        idempotency_key:
          type: string
          format: uuid
        reversal_of_id:
          type: [integer, "null"]
        unit_cost:
          type: [string, "null"]
          description: Decimal with 2 places, serialised as a string.
        device_timestamp:
          type: [string, "null"]
          format: date-time
        server_received_at:
          type: [string, "null"]
          format: date-time
        note:
          type: [string, "null"]
    PartRaw:
      type: object
      description: |
        Eloquent serialisation of a catalog part. NOT allowlisted: includes
        `purchase_cost`, `sale_price` and `member_price` (known 0.3.0 gap on the
        technician transfer and stocktake lists).
      additionalProperties: true
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        unit:
          type: [string, "null"]
        qr_code:
          type: [string, "null"]
    VehicleStockTransfer:
      type: object
      description: |
        Eloquent serialisation with `part`, `from_location.vehicle.assigned_user`
        and `to_location.vehicle.assigned_user` when listed. NOT allowlisted: the
        nested users carry every non-hidden user column (email, phone,
        hourly_cost, permissions…) — known 0.3.0 gap.
      additionalProperties: true
      properties:
        id:
          type: integer
        transfer_no:
          type: string
        part_id:
          type: integer
        qty:
          type: string
        from_location_id:
          type: integer
        to_location_id:
          type: integer
        status:
          type: string
          enum: [pending, pending_release, pending_receive, accepted]
          description: The app lists `pending`/`pending_receive` (to receive) and `pending_release` (to hand over).
        released_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        note:
          type: [string, "null"]
        part:
          $ref: "#/components/schemas/PartRaw"
        from_location:
          type: object
          additionalProperties: true
        to_location:
          type: object
          additionalProperties: true
    StocktakeSession:
      type: object
      description: Eloquent serialisation with `location.vehicle` and `lines.part` (see PartRaw).
      additionalProperties: true
      properties:
        id:
          type: integer
        public_reference:
          type: string
        stock_location_id:
          type: integer
        assigned_user_id:
          type: [integer, "null"]
        status:
          type: string
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        location:
          type: object
          additionalProperties: true
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: integer
              part_id:
                type: integer
              expected_qty:
                type: string
              counted_qty:
                type: [string, "null"]
              variance_qty:
                type: [string, "null"]
              scan_code:
                type: [string, "null"]
              part:
                $ref: "#/components/schemas/PartRaw"
    Custody:
      type: object
      description: Eloquent serialisation (with `vehicle` and `stock_location` on the list).
      additionalProperties: true
      properties:
        id:
          type: integer
        custody_no:
          type: string
        user_id:
          type: integer
        vehicle_id:
          type: [integer, "null"]
        stock_location_id:
          type: [integer, "null"]
        item_type:
          type: string
        item_name:
          type: string
        serial_number:
          type: [string, "null"]
        condition_out:
          type: [string, "null"]
        condition_in:
          type: [string, "null"]
        status:
          type: string
          description: "`issued` until the technician accepts (`accepted`); `returned` once handed back on the panel."
        issued_at:
          type: [string, "null"]
          format: date-time
        accepted_at:
          type: [string, "null"]
          format: date-time
        accepted_name:
          type: [string, "null"]
        accepted_signature_hash:
          type: [string, "null"]
        returned_at:
          type: [string, "null"]
          format: date-time
    Vehicle:
      type: object
      description: |
        Eloquent serialisation of the technician's active vehicle with its active
        documents (by expiry) and five latest inspections. File paths are hidden.
      additionalProperties: true
      properties:
        id:
          type: integer
        plate:
          type: string
        internal_code:
          type: [string, "null"]
        make:
          type: [string, "null"]
        model:
          type: [string, "null"]
        year:
          type: [integer, "null"]
        operational_status:
          type: [string, "null"]
        current_odometer_km:
          type: [string, "null"]
        next_service_on:
          type: [string, "null"]
        next_service_odometer_km:
          type: [string, "null"]
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        inspections:
          type: array
          items:
            $ref: "#/components/schemas/VehicleInspection"
    VehicleInspection:
      type: object
      description: Eloquent serialisation; the photo path is hidden.
      additionalProperties: true
      properties:
        id:
          type: integer
        inspection_no:
          type: string
        vehicle_id:
          type: integer
        inspected_by:
          type: integer
        inspected_at:
          type: string
          format: date-time
        odometer_km:
          type: string
        checklist:
          type: object
          additionalProperties:
            type: boolean
        is_roadworthy:
          type: boolean
        defects:
          type: [string, "null"]
        photo_name:
          type: [string, "null"]
        photo_mime_type:
          type: [string, "null"]
        photo_size:
          type: [integer, "null"]
    InspectionForm:
      type: object
      required: [odometer_km, tires, brakes, lights, fluids, body, cleanliness]
      properties:
        odometer_km:
          type: number
          minimum: 0
        tires:
          type: boolean
        brakes:
          type: boolean
        lights:
          type: boolean
        fluids:
          type: boolean
        body:
          type: boolean
        cleanliness:
          type: boolean
        defects:
          type: [string, "null"]
          maxLength: 3000
        photo:
          type: string
          format: binary
          description: Optional PNG/JPEG/WebP image, at most 5 MB (multipart only). Stored on the private files disk.
    WorkOrderRaw:
      type: object
      description: Eloquent serialisation of the work order (not an allowlisted resource).
      additionalProperties: true
      properties:
        id:
          type: integer
        wo_number:
          type: string
        type:
          type: string
        priority:
          type: string
        status:
          type: string
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        fault_code:
          type: [string, "null"]
        diagnosis_code:
          type: [string, "null"]
        resolution_summary:
          type: [string, "null"]
        sla_due_at:
          type: [string, "null"]
          format: date-time
    VisitRaw:
      type: object
      description: Eloquent serialisation of the visit (back-office routes only; not an allowlisted resource).
      additionalProperties: true
      properties:
        id:
          type: integer
        state:
          $ref: "#/components/schemas/VisitState"
        assigned_user_id:
          type: [integer, "null"]
        is_rework:
          type: boolean
        rework_reason:
          type: [string, "null"]
        rework_system_flagged:
          type: boolean
        rework_overridden_by:
          type: [integer, "null"]
        rework_override_note:
          type: [string, "null"]
        is_billable:
          type: boolean
    AdditionalWorkApproval:
      type: object
      description: Eloquent serialisation of the client approval request.
      additionalProperties: true
      properties:
        id:
          type: integer
        public_reference:
          type: string
        visit_id:
          type: integer
        client_id:
          type: integer
        title:
          type: string
        description:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        amount:
          type: string
          description: Pre-VAT total, decimal string.
        vat_amount:
          type: string
        total_amount:
          type: string
        status:
          type: string
          description: "`pending` until the client decides; blocks the visit close meanwhile."
        requested_from:
          type: string
          example: technician_app
    CreditNote:
      type: object
      description: The external credit-note document requested for the return (Eloquent serialisation).
      additionalProperties: true
      properties:
        id:
          type: integer
        doc_type:
          type: string
        provider:
          type: string
          description: "`fake` or `manual` (manual: pending until the finance team records the number in the external ZATCA tool)."
        parent_document_id:
          type: [integer, "null"]
        status:
          type: string
        amount:
          type: [string, "null"]
        vat_amount:
          type: [string, "null"]

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and register the device
      description: |
        Throttled (`login`): 10/min per IP and 5/min per email+IP, on top of the
        per-account lockout (default 5 failures → 15 minutes, owner inbox alert;
        an unknown email locks exactly like a real one).

        Owner/admin accounts must have MFA confirmed and send a live TOTP or a
        recovery code in `mfa_code`. Technicians sign in with a password only.

        The first device of a technician is approved automatically. Any further
        new device gets no token until the owner (or a user with the `team`
        permission) approves it on the panel; the app keeps its queue and retries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_uuid]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_uuid:
                  type: string
                  format: uuid
                platform:
                  type: [string, "null"]
                  maxLength: 32
                  default: android
                label:
                  type: [string, "null"]
                  maxLength: 120
                app_version:
                  type: [string, "null"]
                  maxLength: 32
                mfa_code:
                  type: [string, "null"]
                  maxLength: 32
                  description: TOTP or recovery code; required for owner/admin.
                device_integrity:
                  type: [object, "null"]
                  description: Self-reported by the app (heuristics). Recorded and shown to the owner; never a gate.
                  properties:
                    rooted:
                      type: [boolean, "null"]
                    emulator:
                      type: [boolean, "null"]
      responses:
        "200":
          description: Token issued (any previous token of this device is deleted).
          content:
            application/json:
              schema:
                type: object
                required: [token, server_time, user, device]
                properties:
                  token:
                    type: string
                  server_time:
                    type: string
                    format: date-time
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      role:
                        type: string
                        enum: [owner_supervisor, admin, technician]
                      specialties:
                        type: [array, "null"]
                        items:
                          type: string
                  device:
                    $ref: "#/components/schemas/DeviceRef"
        "403":
          description: |
            `USER_INACTIVE`, `TWO_FACTOR_SETUP_REQUIRED` (owner/admin without
            confirmed MFA), `DEVICE_REVOKED`, or `DEVICE_PENDING_APPROVAL`
            (carries the pending `device`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DevicePendingApproval"
                  - allOf:
                      - $ref: "#/components/schemas/Error"
                      - type: object
                        properties:
                          code:
                            type: string
                            enum: [USER_INACTIVE, TWO_FACTOR_SETUP_REQUIRED, DEVICE_REVOKED]
        "409":
          description: "`DEVICE_BOUND_TO_ANOTHER_USER` — revoke the device on the panel first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Invalid credentials (validation error on `email`), other validation
            errors, or `TWO_FACTOR_REQUIRED` (owner/admin without a valid code).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - allOf:
                      - $ref: "#/components/schemas/Error"
                      - type: object
                        properties:
                          code:
                            type: string
                            enum: [TWO_FACTOR_REQUIRED]
        "429":
          description: |
            `ACCOUNT_TEMPORARILY_LOCKED` with `retry_after` seconds (password or
            second-factor lockout), or the plain throttle response.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountLocked"
                  - $ref: "#/components/schemas/PlainMessage"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Delete the current token
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current account and server time
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: The account (unwrapped — no `data` key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/devices/{device}/revoke:
    post:
      tags: [Auth]
      summary: Revoke a lost or stolen handset
      description: |
        Owner only. Deletes the device's token; the device's next request gets
        403 `DEVICE_REVOKED` and the app wipes its local data. Devices outside
        the owner's company are 404.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: [string, "null"]
                  maxLength: 190
      responses:
        "200":
          description: Revoked and audited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [revoked]
                  device_id:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/sync/bootstrap:
    get:
      tags: [Sync]
      summary: Everything the device needs to work with no network
      description: |
        The caller's visits scheduled today or tomorrow, plus every visit of
        theirs that is not yet completed regardless of date (so a job still open
        after midnight does not vanish from the phone).
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [server_time, visits]
                properties:
                  server_time:
                    type: string
                    format: date-time
                  visits:
                    type: array
                    items:
                      $ref: "#/components/schemas/BootstrapVisit"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/sync/events:
    post:
      tags: [Sync]
      summary: Batch event ingest — replay safe
      description: |
        The same batch may be posted any number of times; each `client_event_id`
        takes effect once. Events are applied in per-device `sequence` order and
        each returns its own status — one bad event never rejects the batch (the
        app isolates it by bisection). The app sends batches of at most 200
        events / 512 KB and pushes before it pulls.

        Throttled per device token: `DARAK_SYNC_EVENTS_PER_MINUTE` (default 120)
        requests per minute. 429 is not a failed upload on the phone; it backs off.

        Failure logs carry the event id, exception class, SQLSTATE, location and
        request id — never the SQL text or its bindings.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_uuid, events]
              properties:
                device_uuid:
                  type: string
                  format: uuid
                  description: Must be a registered device of the caller (else 403 DEVICE_MISMATCH; unknown → 404).
                last_trusted_server_time:
                  type: [string, "null"]
                  format: date-time
                  description: Default for events that do not carry their own.
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/SyncEvent"
      responses:
        "200":
          description: Per-event outcome plus the canonical state of every touched visit.
          content:
            application/json:
              schema:
                type: object
                required: [server_time, results, visits]
                properties:
                  server_time:
                    type: string
                    format: date-time
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncResult"
                  visits:
                    type: array
                    items:
                      $ref: "#/components/schemas/CanonicalVisit"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            `DEVICE_MISMATCH` (device_uuid registered to another user) or any of
            the device-level refusals (`DEVICE_REVOKED`, `USER_INACTIVE`,
            `DEVICE_PENDING_APPROVAL`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            Batch-level validation failed (shape, more than 200 events, a payload
            over 32768 bytes). Per-event business refusals are 200 with
            `status: rejected`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/visits:
    get:
      tags: [Visits]
      summary: Visits, scoped by role
      description: |
        A technician sees only their own visits (enforced here, not in the UI).
        Back-office accounts need the `operations` panel permission (owner
        always). At most 200 rows, ordered by scheduled start.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VisitState"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/VisitSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/visits/{visit}:
    get:
      tags: [Visits]
      summary: One visit with evidence, parts and close blockers
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VisitDetail"
                  close_blockers:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloseBlocker"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/visits/{visit}/transition:
    post:
      tags: [Visits]
      summary: Move the visit through its lifecycle (online path)
      description: |
        Allowed for the owner and for the assigned technician. Accepts
        `Idempotency-Key`. Offline transitions go through `visit.transition`
        sync events instead.
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  $ref: "#/components/schemas/VisitState"
                lat:
                  type: [number, "null"]
                lng:
                  type: [number, "null"]
                source:
                  type: [string, "null"]
                  maxLength: 24
                  default: api
                client_event_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Transitioned.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VisitSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`INVALID_VISIT_TRANSITION` (not in the allowed map) or `IDEMPOTENCY_REQUEST_IN_PROGRESS`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidVisitTransition"
                  - $ref: "#/components/schemas/IdempotencyError"
        "422":
          description: |
            `VISIT_CLOSE_BLOCKED` with the full blocker list, a validation error,
            or `IDEMPOTENCY_KEY_INVALID` / `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VisitCloseBlocked"
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/IdempotencyError"

  /api/v1/visits/{visit}/close-blockers:
    get:
      tags: [Visits]
      summary: What still prevents closing
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [can_close, blockers]
                properties:
                  can_close:
                    type: boolean
                  blockers:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloseBlocker"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/visits/{visit}/assign:
    post:
      tags: [Visits]
      summary: Dispatch a visit to a technician
      description: |
        Owner, or admin with the `operations` permission (same rule as the
        panel). Hard guards only: the technician must be active, a technician,
        of the visit client's company and branch, inside their shift, listed for
        the asset's specialty (when they list any), free of overlapping visits,
        and within the work policy in force (`WorkPolicyService::violations`).
        A technician outside the caller's tenant is 404.
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
      responses:
        "200":
          description: Assigned; the technician is notified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VisitRaw"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`ASSIGNMENT_BLOCKED` with `reasons[]` (including work-policy violations), or a validation error."
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/Error"
                      - type: object
                        required: [reasons]
                        properties:
                          code:
                            type: string
                            enum: [ASSIGNMENT_BLOCKED]
                          reasons:
                            type: array
                            items:
                              type: string
                  - $ref: "#/components/schemas/ValidationError"

  /api/v1/visits/{visit}/rework-override:
    post:
      tags: [Visits]
      summary: Reclassify a system-flagged rework
      description: |
        Owner only (it changes billing). The technician cannot clear the flag —
        otherwise every repeat visit gets relabelled and first-time-fix stays
        clean.
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, note]
              properties:
                reason:
                  type: string
                  maxLength: 64
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Overridden and audited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VisitRaw"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/visits/{visit}/diagnosis-suggestions:
    get:
      tags: [Visits]
      summary: Diagnosis suggestions from the knowledge base and history
      description: Up to 10 suggestions for the visit's asset (company knowledge base first, then past work orders on the asset).
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
        - name: fault_code
          in: query
          required: false
          description: Defaults to the work order's fault code.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          enum: [knowledge, history]
                        title:
                          type: [string, "null"]
                        diagnosis:
                          type: [string, "null"]
                        solution:
                          type: [string, "null"]
                        part_ids:
                          type: array
                          items:
                            type: integer
                  prediction_readiness:
                    type: object
                    description: Statistical prediction stays hidden until both minimums are met.
                    properties:
                      ready:
                        type: boolean
                      completed:
                        type: integer
                      coded:
                        type: integer
                      minimum_completed:
                        type: integer
                        example: 500
                      minimum_coded:
                        type: integer
                        example: 100
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The visit's work order is not linked to an asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlainMessage"

  /api/v1/visits/{visit}/diagnosis:
    post:
      tags: [Visits]
      summary: Record the fault and diagnosis codes on the work order
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fault_code, diagnosis_code]
              properties:
                fault_code:
                  type: string
                  maxLength: 64
                diagnosis_code:
                  type: string
                  maxLength: 64
                resolution_summary:
                  type: [string, "null"]
                  maxLength: 4000
      responses:
        "200":
          description: Recorded and audited (before/after).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WorkOrderRaw"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"

  /api/v1/visits/{visit}/additional-work:
    post:
      tags: [Visits]
      summary: Request client approval for additional work and parts
      description: |
        Only while the visit is `started` or `paused`. The request appears in
        the client portal; the visit cannot close while it is pending.
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, items]
              properties:
                title:
                  type: string
                  maxLength: 190
                description:
                  type: string
                  maxLength: 1500
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    required: [description, qty, unit_price]
                    properties:
                      part_id:
                        type: [integer, "null"]
                      description:
                        type: string
                        maxLength: 190
                      qty:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 10000
                      unit_price:
                        type: number
                        minimum: 0
                        maximum: 1000000
                        description: Pre-VAT SAR. Totals are computed with exact decimal math (Money).
      responses:
        "201":
          description: Approval request created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdditionalWorkApproval"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"

  /api/v1/visits/{visit}/location:
    post:
      tags: [Visits]
      summary: Report the technician's position while en route
      description: |
        Assigned technician only; sent best-effort while the app is open. Stores
        the latest position (no track) and recomputes the ETA. The client portal
        shows a ~100 m rounded position only while the visit is `en_route`.
        Throttled 30/min.
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      location_updated_at:
                        type: string
                        format: date-time
                      estimated_arrival_at:
                        type: string
                        format: date-time
                      route_provider:
                        type: string
                        enum: [local, mapbox]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/visits/{visit}/report.pdf:
    get:
      tags: [Reports]
      summary: Arabic RTL technical condition report
      description: |
        A maintenance record, not a compliance certificate. Scoped by the visit
        policy (assigned technician, owner, or admin with `operations`).
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: PDF (inline, `darak-visit-<id>.pdf`).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/media/{clientMediaId}/status:
    get:
      tags: [Media]
      summary: Where to resume an interrupted upload
      description: Anyone who may view the visit. Throttled 60/min.
      parameters:
        - $ref: "#/components/parameters/ClientMediaId"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_media_id:
                    type: string
                    format: uuid
                  upload_state:
                    type: string
                    enum: [pending, uploading, complete, failed, discarded]
                  uploaded_bytes:
                    type: integer
                  total_bytes:
                    type: [integer, "null"]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/media/{clientMediaId}/chunk:
    post:
      tags: [Media]
      summary: Append one chunk at the declared offset
      description: |
        Write gate: only the technician who registered the file, from the
        device that registered it (rows registered before 0.3.0 fall back to the
        visit's assigned technician). Back-office accounts read only.
        Throttled 60/min.
      parameters:
        - $ref: "#/components/parameters/ClientMediaId"
        - $ref: "#/components/parameters/AppVersion"
        - name: X-Upload-Offset
          in: header
          required: true
          description: Byte offset of this chunk; must equal the server's `uploaded_bytes`.
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw bytes, at most 8 MiB per chunk.
      responses:
        "200":
          description: Chunk stored, or `ALREADY_COMPLETE` when the file had already finished.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [uploaded_bytes, total_bytes, upload_state]
                    properties:
                      uploaded_bytes:
                        type: integer
                      total_bytes:
                        type: integer
                      upload_state:
                        type: string
                        enum: [uploading]
                  - type: object
                    required: [code, uploaded_bytes]
                    properties:
                      code:
                        type: string
                        enum: [ALREADY_COMPLETE]
                      uploaded_bytes:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`OFFSET_MISMATCH` (carries `expected_offset` — resume from there), `UPLOAD_BUSY` (retry the chunk) or `MEDIA_DISCARDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRejection"
        "413":
          description: "`CHUNK_TOO_LARGE` (> 8 MiB) or `UPLOAD_LIMIT_EXCEEDED` (beyond the declared size or DARAK_MAX_MEDIA_BYTES)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRejection"
        "422":
          description: "`EMPTY_CHUNK` or `INVALID_MEDIA_SIZE` (register the file again)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRejection"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          description: "`WRITE_FAILED` — the chunk was not stored; retry it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRejection"

  /api/v1/media/{clientMediaId}/complete:
    post:
      tags: [Media]
      summary: Verify size and hash, then finalise
      description: |
        Same write gate as `chunk`. The declared size must match, then the
        SHA-256 (of the plaintext captured file). Images are header-checked
        before decoding: above DARAK_MAX_IMAGE_PIXELS (40 MP) or
        DARAK_MAX_IMAGE_SIDE (12000 px) the upload is reset and refused with
        `IMAGE_TOO_LARGE` so the app can re-capture. On hash mismatch the
        upload resets rather than storing a corrupt file. The original is kept
        with its hash; photos also get a stamped derivative.

        Not idempotent after success: a repeated `complete` finds no partial
        file and returns 422 `NO_UPLOAD` — check `status` first.
        Throttled 60/min.
      parameters:
        - $ref: "#/components/parameters/ClientMediaId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256]
              properties:
                sha256:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_media_id:
                    type: string
                    format: uuid
                  upload_state:
                    type: string
                    enum: [complete]
                  original_hash:
                    type: string
                  has_derived:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`MEDIA_DISCARDED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRejection"
        "422":
          description: "`NO_UPLOAD`, `SIZE_MISMATCH`, `HASH_MISMATCH`, `IMAGE_TOO_LARGE` (with `max_pixels`, `max_side`), or a validation error."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MediaRejection"
                  - $ref: "#/components/schemas/ValidationError"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/media/{clientMediaId}/discard:
    post:
      tags: [Media]
      summary: Drop evidence that will never upload
      description: |
        Same write gate as `chunk`. The row is kept (who dropped what and why is
        part of the trail) and stops blocking the close. Completed evidence
        cannot be discarded from the app. Throttled 60/min.
      parameters:
        - $ref: "#/components/parameters/ClientMediaId"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 190
                superseded_by:
                  type: [string, "null"]
                  format: uuid
                  description: client_media_id of the replacement capture on the same visit.
      responses:
        "200":
          description: Discarded and audited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_media_id:
                    type: string
                    format: uuid
                  discarded_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`CANNOT_DISCARD_COMPLETE`, or a validation error."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MediaRejection"
                  - $ref: "#/components/schemas/ValidationError"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/custodies:
    get:
      tags: [Custody]
      summary: The caller's custody items
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Custody"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/custodies/{custody}/accept:
    post:
      tags: [Custody]
      summary: Accept an issued custody item
      description: |
        Only the custody holder, only while `issued`. Stores the accepting name
        and a signature hash and writes an audit record. Accepts `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/CustodyId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted_name]
              properties:
                accepted_name:
                  type: string
                  maxLength: 190
      responses:
        "200":
          description: Accepted.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Custody"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"

  /api/v1/fleet/vehicle:
    get:
      tags: [Fleet]
      summary: The caller's active vehicle
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: The vehicle, or `data` null when none is assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Vehicle"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/fleet/vehicle/inspection:
    post:
      tags: [Fleet]
      summary: Record a vehicle safety inspection
      description: |
        For the caller's active vehicle (404 when none). A failed critical item
        stops the vehicle and reassigns its visits. Throttled 10/min. Accepts
        `Idempotency-Key` (multipart bodies are fingerprinted by their fields
        and file bytes).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InspectionForm"
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionForm"
      responses:
        "201":
          description: Recorded.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VehicleInspection"
                  message:
                    type: string
                  reassigned_visits:
                    type: integer
                    description: Visits reassigned because the vehicle failed (0 when roadworthy).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"
        "429":
          $ref: "#/components/responses/Throttled"

  /api/v1/inventory/vehicle-transfers:
    get:
      tags: [Inventory]
      summary: Transfers waiting for the caller to receive
      description: Status `pending` or `pending_receive`, destined to the caller's vehicle. Eloquent serialisation (see VehicleStockTransfer for the known over-exposure).
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleStockTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/inventory/vehicle-transfer-releases:
    get:
      tags: [Inventory]
      summary: Transfers waiting for the caller to hand over
      description: Status `pending_release`, leaving the caller's vehicle.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleStockTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/inventory/vehicle-transfers/{transfer}/release:
    post:
      tags: [Inventory]
      summary: Sender confirms handing the stock over
      description: Only the technician assigned to the sending vehicle. Accepts `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Released; now waiting for the receiver.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VehicleStockTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"
        "500":
          $ref: "#/components/responses/DomainRefusalAsServerError"

  /api/v1/inventory/vehicle-transfers/{transfer}/accept:
    post:
      tags: [Inventory]
      summary: Receiver accepts the transfer (stock moves only now)
      description: Only the technician assigned to the receiving vehicle. Accepts `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/TransferId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Accepted; balances updated.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VehicleStockTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"
        "500":
          $ref: "#/components/responses/DomainRefusalAsServerError"

  /api/v1/inventory/stocktakes:
    get:
      tags: [Inventory]
      summary: Open stocktake sessions for the caller
      description: Sessions assigned to the caller or on the caller's vehicle.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StocktakeSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/inventory/stocktakes/{session}/scan:
    post:
      tags: [Inventory]
      summary: Record a counted quantity for a scanned code
      description: Assigned user or the vehicle's technician. Accepts `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/StocktakeSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, qty]
              properties:
                code:
                  type: string
                  maxLength: 96
                  description: Part QR/barcode or SKU.
                qty:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: The session with its lines.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StocktakeSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"
        "500":
          $ref: "#/components/responses/DomainRefusalAsServerError"

  /api/v1/inventory/stocktakes/{session}/complete:
    post:
      tags: [Inventory]
      summary: Close the stocktake and post the variances
      description: Assigned user or the vehicle's technician. Accepts `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/StocktakeSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: The closed session with its lines.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StocktakeSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableIdempotent"
        "500":
          $ref: "#/components/responses/DomainRefusalAsServerError"

  /api/v1/inventory/locations/{location}/balances:
    get:
      tags: [Inventory]
      summary: Current balances at one location (back office)
      description: Owner/admin with the `inventory` permission. Locations outside the caller's company/branch are 404.
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      type:
                        type: string
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        part_id:
                          type: integer
                        sku:
                          type: string
                        name:
                          type: string
                        qty:
                          type: number
                        reorder_level:
                          type: number
                        below_reorder:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inventory/receipt:
    post:
      tags: [Inventory]
      summary: Supplier receipt into a location (back office)
      description: |
        Owner/admin with the `inventory` permission. Replay safety comes from
        the `idempotency_key` in the BODY (unique stock-move key), not from the
        Idempotency-Key header middleware.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, part_id, qty, to_location_id]
              properties:
                idempotency_key:
                  type: string
                  format: uuid
                part_id:
                  type: integer
                qty:
                  type: number
                  exclusiveMinimum: 0
                to_location_id:
                  type: integer
                note:
                  type: [string, "null"]
                  maxLength: 500
      responses:
        "201":
          description: Movement recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StockMove"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/inventory/vehicle-load:
    post:
      tags: [Inventory]
      summary: Warehouse to vehicle (back office)
      description: Owner/admin with the `inventory` permission. Body `idempotency_key` as for receipts. Cross-company moves are refused.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, part_id, qty, from_location_id, to_location_id]
              properties:
                idempotency_key:
                  type: string
                  format: uuid
                part_id:
                  type: integer
                qty:
                  type: number
                  exclusiveMinimum: 0
                from_location_id:
                  type: integer
                to_location_id:
                  type: integer
      responses:
        "201":
          description: Movement recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StockMove"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/inventory/return:
    post:
      tags: [Inventory]
      summary: Return a part issued on a visit (back office)
      description: |
        Owner/admin with the `inventory` permission. Corrects stock and cost.
        When the visit was already invoiced this also requests a CREDIT NOTE —
        the issued invoice is never modified. With the `manual` provider the
        credit note stays pending until finance records it.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key, original_move_id, qty, to_location_id]
              properties:
                idempotency_key:
                  type: string
                  format: uuid
                original_move_id:
                  type: integer
                qty:
                  type: number
                  exclusiveMinimum: 0
                to_location_id:
                  type: integer
                request_credit_note:
                  type: [boolean, "null"]
                  default: true
      responses:
        "201":
          description: Movement plus the credit-note outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StockMove"
                  credit_note:
                    description: Null when not requested; `{skipped}` when there is no issued invoice to credit.
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/CreditNote"
                      - type: object
                        required: [skipped]
                        properties:
                          skipped:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/reports/visits.csv:
    get:
      tags: [Reports]
      summary: Visit export (UTF-8 with BOM so Excel reads Arabic)
      description: |
        Owner/admin with the `operations` permission. Defaults to the last 30
        days. Cells starting with `= + - @` are prefixed with `'` (CSV injection).
        Columns: visit_id, wo_number, client, site, technician, type, state,
        scheduled_start, started_at, closed_at, on_site_minutes, is_rework,
        system_flagged, billable.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: CSV download `darak-visits.csv`.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/reports/stock-moves.csv:
    get:
      tags: [Reports]
      summary: Stock movement export
      description: |
        Owner/admin with the `inventory` permission. Defaults to the last 30
        days. `unit_cost` is an exact two-decimal string. Columns: move_id, type,
        sku, part, qty, from, to, visit_id, unit_cost, device_timestamp,
        server_received_at.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: CSV download `darak-stock-moves.csv`.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"

  /api/v1/reports/first-time-fix:
    get:
      tags: [Reports]
      summary: First-time-fix, strict and adjusted
      description: |
        Owner/admin with the `performance` permission. Defaults to the last 90
        days. Two figures: the gap between strict and supervisor-adjusted is
        itself a supervision signal. Sector benchmarks quoted during planning
        are unverified — build the baseline from the first 90 days of real data.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                  first_time_fix:
                    type: object
                    properties:
                      strict:
                        type: number
                        description: Percent, one decimal.
                      adjusted:
                        type: number
                        description: Percent after supervisor overrides.
                      total:
                        type: integer
                      rework:
                        type: integer
                      overridden:
                        type: integer
                  note:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
