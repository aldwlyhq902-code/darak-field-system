; Darak — PHP-FPM pool. Installed to /etc/php/__PHP_VERSION__/fpm/pool.d/darak.conf
; by deploy/provision-ubuntu.sh. Runs as the application user, not www-data, so
; only this pool can read .env and write storage/.

[darak]
user = __APP_USER__
group = __APP_USER__

listen = /run/php/php__PHP_VERSION__-fpm-darak.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for 2 vCPU / 4 GB: about 60 MB per worker leaves room for PostgreSQL,
; Redis and the nightly backup.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 130s
request_slowlog_timeout = 10s
slowlog = /var/log/php__PHP_VERSION__-fpm-darak-slow.log
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
; Forwarded headers are trusted only from Nginx on this host. Read before .env
; is loaded (bootstrap/app.php), so it belongs here rather than in .env.
env[TRUSTED_PROXIES] = 127.0.0.1,::1

php_admin_value[upload_max_filesize] = 30M
php_admin_value[post_max_size] = 32M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php__PHP_VERSION__-fpm-darak-error.log
