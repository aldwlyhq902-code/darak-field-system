# Darak — Nginx site. Installed to /etc/nginx/sites-available/darak.conf by
# deploy/provision-ubuntu.sh (__DOMAIN__ and __APP_ROOT__ are substituted).
#
# Only backend/public is web-visible; .env, storage, vendor and backups live
# outside the document root and are unreachable by construction. PHP runs only
# through the Laravel front controller.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    # certbot renewals (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    root __APP_ROOT__/backend/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:darak_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One HSTS header for every response (Laravel's copy is hidden below).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Evidence photos arrive in resumable chunks well under this; the margin
    # covers the multipart overhead of the largest single upload (25 MiB).
    client_max_body_size 30m;
    client_body_timeout 120s;

    access_log /var/log/nginx/darak-access.log;
    error_log  /var/log/nginx/darak-error.log warn;

    # Dotfiles (.env, .git, .htaccess …) — never served, never acknowledged.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Archives, dumps and logs must never be web-reachable even if someone
    # drops one into public/ by mistake.
    location ~* \.(?:sql|zip|gz|tar|bak|log|sqlite|env|ini|sh|pem|key)$ {
        deny all;
        return 404;
    }

    # Fingerprinted Vite assets.
    location ^~ /build/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The front controller is the only PHP entry point.
    location = /index.php {
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-darak.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        # httpoxy: never let a client-supplied Proxy header become HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Any other .php path is not code we serve.
    location ~ \.php$ {
        return 404;
    }
}
